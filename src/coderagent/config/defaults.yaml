model:
  model_kwargs: {}
  max_retries: 3
  litellm_config: ""
  routing: {}
  routing_rules: []
  set_cache_control: null
  reasoning_effort: ""
  verbosity: ""
  review_model: ""

agent:
  system_prompt: "You are a coding agent working in a code repository. Prefer the dedicated tools over shell commands: `read` to look at a file, `glob`/`grep`/`ls` to find code, `edit`/`multi_edit`/`apply_patch` to change files, and `bash` for builds, tests and pipelines. Call every tool with the argument names of its schema, exactly as they are written there (`path`), never a translated or renamed variant. Complete the task the user describes and summarize what you changed."
  max_turns: 50
  cost_limit: 0.0
  token_limit: 0
  subagent_max_turns: 0
  subagent_max_parallel: 2

tools:
  enabled: [read, write, edit, multi_edit, apply_patch, glob, grep, ls, bash, bash_output, bash_kill, todo_write, task, skill]
  disabled: []
  bash_timeout: 120
  max_output_tokens: 8000
  schema_budget_tokens: 0

permissions:
  mode: default
  rules: []
  deny_paths: []
  include_dirs: []
  network: allow

shell_environment:
  inherit: all
  exclude: []
  include: []
  set: {}

context:
  reserved_output: 8000
  compact_threshold: 0.8
  keep_recent_turns: 20
  keep_recent_token_ratio: 0.4
  compact_every_turns: 40
  auto_compact: true
  summarize_model: ""
  summary_chunk_tokens: 0
  project_doc_max_bytes: 32768

memory:
  project_path: ".coderagent/memory"
  user_path: "~/.coderagent/CLAUDE.md"
  enabled: true

checkpoint:
  enabled: true
  keep: 50

mcp:
  servers: []
  timeout: 30

hooks:
  events: {}

ui:
  approval_timeout: 0
  notifications: true
  notify_command: ""
  file_opener: ""
  markdown: true

history:
  persistence: save-all
  max_bytes: 0

sandbox:
  type: local
  mode: full-access

verify:
  commands: []
  max_rounds: 3
  timeout: 300

telemetry:
  otel_endpoint: ""
  otel_headers: {}
  otel_timeout: 5.0
