site_name: The coding agent
theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    annotation: material/chevron-right-circle
  custom_dir: docs/overrides
  logo: assets/coder.svg
  favicon: assets/coder.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - scheme: default
      # primary: black  # override in custom.css
      accent: deep orange
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      # primary: black  # override in custom.css
      accent: deep orange
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - content.action.edit
    - navigation.footer
    - content.code.copy
    - content.footnote.tooltips
    - header.autohide
    - announce.dismiss
    - content.code.annotate
    - navigation.tabs
    - navigation.tabs.sticky
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.magiclink
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - The coding agent:
      - "Overview": index.md
      - "The whole thing": usage/coderagent.md
      - "The README": readme.md
      - "Overview (中文)": readme_zh.md
      - "Quick start": usage/coderagent_quickstart.md
      - "Features": usage/coderagent_features.md
      - "Features (中文)": usage/coderagent_features_zh.md
      - "The web interface": usage/coderagent_web.md
      - "The web interface (中文)": usage/coderagent_web_zh.md
      - "Commands": usage/coderagent_commands.md
      - "Commands (中文)": usage/coderagent_commands_zh.md
      - "Sub agents": usage/coderagent_subagents.md
      - "Sub agents (中文)": usage/coderagent_subagents_zh.md
      - "Skills": usage/coderagent_skills.md
      - "Skills (中文)": usage/coderagent_skills_zh.md
      - "Memory": usage/coderagent_memory.md
      - "Model routing": usage/coderagent_routing.md
      - "MCP servers": usage/coderagent_mcp.md
      - "Hooks": usage/coderagent_hooks.md
      - "Hooks (中文)": usage/coderagent_hooks_zh.md
      - "Plugins": usage/coderagent_plugins.md
      - "Sandbox": usage/coderagent_sandbox.md
      - "Sandbox (中文)": usage/coderagent_sandbox_zh.md
      - "Trace export": usage/coderagent_export.md
      - "Evals": usage/coderagent_eval.md
      - "Evals (中文)": usage/coderagent_eval_zh.md
  - Design (WIP):
    - "Overview": design/README.md
    - "Architecture": design/coding-agent-architecture.md
    - "Design logic": design/coderagent-design-logic.md
    - "Questions": design/coderagent-questions.md
    - "Answers": design/coderagent-answers.md
    - "Topic — Context & compaction": design/coderagent-context.md
    - "Topic — Compared with Codex": design/coderagent-vs-codex.md
    - "Topic — Skill hub & the skills page": design/coderagent-skill-hub.md
    - "Topic — Standing on its own": design/coderagent-standalone.md
    - "M0 — Skeleton & config": design/milestones/M0-skeleton.md
    - "M1 — Tools & permissions": design/milestones/M1-tools-permissions.md
    - "M2 — Context & sessions": design/milestones/M2-context-session.md
    - "M3 — UI & extensions": design/milestones/M3-ui-extensions.md
    - "M4 — Advanced": design/milestones/M4-advanced.md
    - "M5 — Web interface": design/milestones/M5-web-interface.md
    - "M5 — Web modules": design/milestones/M5-web-modules.md
plugins:
  - glightbox
  - search
  - include-markdown
  - mike:
      canonical_version: latest
      version_selector: true
repo_url: https://github.com/sds819/coder-agent
repo_name: sds819/coder-agent
edit_uri: edit/main/docs/
extra_javascript:
  - assets/js/sh-annotation.js
  - assets/js/gif-controls.js
extra_css:
  - assets/custom.css
  - assets/gif-controls.css
  - assets/image_theme.css
  - assets/bubbles.css
  - assets/navigation_cards.css
  - https://fonts.googleapis.com/icon?family=Material+Icons
extra:
  version:
    provider: mike
